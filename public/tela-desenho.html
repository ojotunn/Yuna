<!doctype html>
<meta charset="utf-8">
<title>Atelier — ao vivo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0f0f11; color: #e8e6e2;
    font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 20px;
    padding: 10px 18px; border-bottom: 1px solid #26262b; flex: none;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .fala {
    flex: 1; color: #ffd25a; font-style: italic; min-height: 21px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .num { color: #8b8b93; font-variant-numeric: tabular-nums; font-size: 13px; }
  main { flex: 1; display: grid; place-items: center; padding: 14px; min-height: 0; }
  #palco { position: relative; display: flex; max-width: 100%; max-height: 100%; }
  #tela {
    max-width: 100%; max-height: 100%; box-shadow: 0 6px 40px #0008;
    background: #1c181b;
  }
  #maos, #trama {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  #tinta {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid #3a3a42; background: #808080;
  }
  footer {
    display: flex; align-items: center; gap: 14px;
    padding: 9px 18px; border-top: 1px solid #26262b; flex: none;
  }
  button {
    background: #26262b; color: #e8e6e2; border: 1px solid #3a3a42;
    border-radius: 6px; padding: 5px 13px; cursor: pointer; font: inherit;
  }
  button:hover { background: #32323a; }
  .barra { flex: 1; height: 4px; background: #26262b; border-radius: 2px; }
  .barra > i { display: block; height: 100%; background: #ffd25a; border-radius: 2px; width: 0; }
  label { color: #8b8b93; display: flex; align-items: center; gap: 7px; }
  /* modo OBS (?obs=1): a cena imita um APP DE PINTURA (referencia do
     Michel: SketchBook Pro) -- canvas no centro do workspace cinza,
     painel de pinceis/camadas a direita com o pincel ATIVO acendendo
     conforme a fase, disco de cor no canto. Tudo en-US: e a lingua da
     stream. */
  body.obs header, body.obs footer, body.obs #letreiro { display: none; }
  body.obs { background: #757575; }
  body.obs main { padding: 52px 268px 26px 300px; }
  body.obs #tela { box-shadow: 0 8px 34px #0007; border: 1px solid #5c5c5c; }
  /* A obra e RETRATO: dimensionada pela largura ela passava de 1400px de
     altura e o OBS cortava o pe do quadro (22/08). O max-height: 100% que
     ja existia nao mordia porque nenhum pai tinha altura definida -- e
     porcentagem sem referencia vira "none". Aqui a cadeia inteira ganha
     altura, entao a tela encolhe ate caber e as camadas (trama, maos)
     acompanham, porque o palco se ajusta ao tamanho da tela. */
  body.obs { height: 100vh; overflow: hidden; }
  body.obs main { height: 100%; min-height: 0; box-sizing: border-box; }
  body.obs #palco { min-height: 0; max-height: 100%; height: 100%;
                    align-items: center; justify-content: center; }
  body.obs #tela { max-height: 100%; max-width: 100%;
                   width: auto; height: auto; }
  #letreiro, #faixa, #progresso-ouro { display: none; }

  /* barra superior do "app" */
  #app-top {
    display: none; position: fixed; top: 0; left: 0; right: 0; height: 40px;
    background: linear-gradient(#f2f2f2, #dedede);
    border-bottom: 1px solid #b5b5b5; color: #333;
    align-items: center; gap: 18px; padding: 0 16px; font-size: 13px;
    z-index: 5;
  }
  body.obs #app-top { display: flex; }
  #app-top .logo { font-weight: 700; letter-spacing: .04em; color: #444; }
  #app-top .doc { color: #666; overflow: hidden; white-space: nowrap;
                  text-overflow: ellipsis; }
  #app-top .live {
    margin-left: auto; display: flex; align-items: center; gap: 7px;
    color: #b02020; font-weight: 600; font-size: 12px; letter-spacing: .08em;
  }
  #app-top .live i {
    width: 9px; height: 9px; border-radius: 50%; background: #d32f2f;
    animation: pulsa 1.6s infinite;
  }
  @keyframes pulsa { 50% { opacity: .35; } }
  #app-top .prog { width: 180px; height: 5px; background: #c8c8c8;
                   border-radius: 3px; overflow: hidden; }
  #app-top .prog i { display: block; height: 100%; width: 0;
                     background: #4d90d0; }

  /* painel direito: camadas (fases) + pinceis */
  #painel {
    display: none; position: fixed; top: 52px; right: 12px; width: 236px;
    bottom: 26px; z-index: 5; flex-direction: column; gap: 12px;
    font-size: 12px; color: #333;
  }
  body.obs #painel { display: flex; }
  #painel .caixa {
    background: #ffffff; border: 1px solid #bfbfbf; border-radius: 0;
    box-shadow: 0 3px 14px #0003; overflow: hidden;
  }
  #painel .caixa h3 {
    margin: 0; padding: 7px 11px; font-size: 11.5px; font-weight: 600;
    color: #444; background: #f4f4f4;
    border-bottom: 1px solid #d6d6d6; letter-spacing: .03em;
  }
  /* Layers saiu da cena (21/08, Michel: "parece artificial") -- o painel
     fica so com a Brush Library, que e o que um pintor de verdade mostra */
  #camadas-app { display: none !important; }
  #camadas-app .item {
    display: flex; align-items: center; gap: 8px; padding: 5px 11px;
    border-bottom: 1px solid #e0e0e0; color: #777;
  }
  #camadas-app .item.ativa { background: #cfe0f2; color: #1d3a5f;
                             font-weight: 600; }
  #camadas-app .item.feita { color: #444; }
  #camadas-app .item .olho { width: 13px; text-align: center; }
  #pinceis-app { flex: 1; }
  #pinceis-app .grade {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px;
    padding: 10px;
  }
  #pinceis-app .pincel {
    aspect-ratio: 1; background: #ffffff; border: 1px solid #cfcfcf;
    border-radius: 0; display: grid; place-items: center;
  }
  #pinceis-app .pincel.ativo {
    background: #ececec; border-color: #777;
    box-shadow: inset 0 0 0 1px #777;
  }
  #pinceis-app canvas { width: 80%; height: 80%; }
  #legenda-app {
    padding: 9px 12px; color: #555; font-size: 12px; line-height: 1.45;
    font-style: italic; min-height: 44px;
  }

  /* thoughts.log: o monologo do agente-pintor, estilo terminal (ref. do
     Michel 21/08) -- timestamps, etiquetas de acao, monoespacada */
  /* branco e quadrado (21/08, pedido do Michel) -- nada de azul */
  #pensa {
    display: none; position: fixed; left: 12px; top: 52px; bottom: 26px;
    width: 268px; z-index: 5; flex-direction: column;
    background: #ffffff; border: 1px solid #bfbfbf; border-radius: 0;
    box-shadow: 0 3px 14px #0003; overflow: hidden;
    font-family: Consolas, "Cascadia Mono", monospace;
  }
  body.obs #pensa { display: flex; }
  #pensa h3 {
    margin: 0; padding: 6px 12px; font-size: 12.5px; font-weight: 600;
    color: #444; background: #f4f4f4; display: flex;
    border-bottom: 1px solid #d6d6d6;
    justify-content: space-between; align-items: center;
  }
  #pensa h3 span { color: #999; font-weight: 400; font-size: 11px; }
  #pensa .rolo { flex: 1; overflow: hidden; padding: 6px 0; }
  .pl { display: flex; gap: 8px; padding: 4px 10px 4px 6px;
        font-size: 11.3px; line-height: 1.45; color: #333;
        border-bottom: 1px solid #f0f0f0; }
  .pl .h { flex: none; width: 56px; text-align: right; color: #aaa;
           font-size: 10px; padding-top: 1.5px; }
  .pl .t { flex: 1; min-width: 0; overflow-wrap: break-word;
           border-left: 2px solid #e3e3e3; padding-left: 8px; }
  .pl .rot { font-size: 9.5px; font-weight: 700; letter-spacing: .06em;
             margin-right: 6px; text-transform: uppercase; }
  .pl.note .rot { color: #7a7a7a; }
  .pl.mix .rot { color: #b07818; }
  .pl.brush .rot { color: #7d4fb0; }
  .pl.phase .rot { color: #2e7d32; }
  .pl.new .rot { color: #1d5fb0; }
  .pl.done .rot { color: #1d5fb0; }
  .pl.chat .rot { color: #b02020; }
  .pl.chat .t { color: #6b2020; }
  .pl.said .rot { color: #0d7a6a; }

  /* disco de cor no canto, como o puck do SketchBook */
  #puck {
    display: none; position: fixed; left: 296px; bottom: 18px;
    width: 96px; height: 96px; border-radius: 50%; z-index: 5;
    background: conic-gradient(#e33, #ea3, #dd3, #4c4, #3cc, #35d, #a3d, #e33);
    box-shadow: 0 4px 18px #0006; border: 3px solid #e6e6e6;
    place-items: center;
  }
  body.obs #puck { display: grid; }
  #puck .miolo {
    width: 62px; height: 62px; border-radius: 50%;
    background: #808080; border: 2px solid #f0f0f0;
  }
</style>

<header>
  <h1>Atelier</h1>

</header>

<main>
  <div id="palco">
    <canvas id="tela"></canvas>
    <canvas id="trama"></canvas>
    <canvas id="maos"></canvas>
    <div id="letreiro"></div>
  </div>
</main>

<div id="progresso-ouro"></div>
<div id="faixa">
  <div class="marca">A T E L I E R</div>
  <div class="meio">
    <div class="titulo" id="faixa-titulo">&nbsp;</div>
    <div class="fala2" id="faixa-fala">&nbsp;</div>
  </div>
  <div class="fase" id="faixa-fase"></div>

<div id="app-top">

</div>

<script>
const cv = document.getElementById("tela");
const ctx = cv.getContext("2d", { alpha: false });
const elFala = document.getElementById("fala");
const elNum = document.getElementById("num");
const elProg = document.getElementById("prog");
const elCam = document.getElementById("camada");
const elVel = document.getElementById("vel");
const elVelNum = document.getElementById("velnum");
const btn = document.getElementById("pausa");

// Fila com ponteiro, nao com shift(): shift() numa lista de 15 mil e O(n),
// e a 60 quadros por segundo isso sozinho engasga a pagina.
let fila = [];
let lido = 0;
let feitos = 0, total = 0, tocando = true, pronto = false;

// A velocidade e em toques por SEGUNDO, nao por quadro. Por quadro, o
// valor padrao antigo (90) dava 5.400/s e a obra inteira acabava em menos
// de 3 segundos -- o que parece travamento, nao pintura.
const elResta = document.getElementById("resta");
function porSegundo() {
  const t = +elVel.value / 100;            // 0..1
  return Math.round(6 * Math.pow(700, t)); // 6/s ate ~4200/s, escala log
}
function formatarTempo(seg) {
  if (!isFinite(seg) || seg < 0) return "—";
  const m = Math.floor(seg / 60), s = Math.round(seg % 60);
  return m ? `${m}min ${String(s).padStart(2, "0")}s` : `${s}s`;
}

// Carimbos: bicos de pincel da gravacao (png com a forma no alfa). Para
// cada um mantemos um canvas de tingimento reutilizado a cada toque.
const carimbos = {};
function carregarCarimbos(dict) {
  for (const [sem, url] of Object.entries(dict || {})) {
    const img = new Image();
    img.onload = () => {
      const tc = document.createElement("canvas");
      tc.width = img.width; tc.height = img.height;
      // versoes claro/escuro fixas do bico, feitas UMA vez: sao o bisel do
      // impasto (crista pega luz, vao sombreia) sem tingir de novo por toque
      const tinge = (cor) => {
        const c = document.createElement("canvas");
        c.width = img.width; c.height = img.height;
        const x = c.getContext("2d");
        x.drawImage(img, 0, 0);
        x.globalCompositeOperation = "source-in";
        x.fillStyle = cor;
        x.fillRect(0, 0, c.width, c.height);
        return c;
      };
      carimbos[sem] = { img, tc, tx: tc.getContext("2d"),
                        brilho: tinge("#fff"), sombra: tinge("#000") };
      // vitrine do painel: cada bico vira um azulejo na Brush Library
      const tile = document.createElement("div");
      tile.className = "pincel";
      tile.dataset.sem = sem;
      const c2 = document.createElement("canvas");
      c2.width = c2.height = 44;
      const x2 = c2.getContext("2d");
      x2.drawImage(img, 0, 0, 44, 44);
      x2.globalCompositeOperation = "source-in";
      x2.fillStyle = "#3b3b3b";
      x2.fillRect(0, 0, 44, 44);
      tile.appendChild(c2);
      document.getElementById("pinceis-grade").appendChild(tile);
    };
    img.src = url;
  }
}

// ------------------------------------------------ thoughts.log do agente
const ROT_EN = { note: "note", mix: "mixed", brush: "brush", phase: "layer",
                 new: "canvas", done: "done", chat: "chat", said: "said" };
let pensaTotal = 0;
function pensar(rotulo, texto, hora) {
  const rolo = document.getElementById("pensa-rolo");
  const div = document.createElement("div");
  div.className = "pl " + rotulo;
  const h = hora || new Date().toTimeString().slice(0, 8);
  div.innerHTML = "<div class='h'>" + h + "</div><div class='t'>" +
    "<span class='rot'>" + (ROT_EN[rotulo] || rotulo) + "</span>" +
    texto.replace(/</g, "&lt;") + "</div>";
  rolo.appendChild(div);
  while (rolo.children.length > 80) rolo.removeChild(rolo.firstChild);
  rolo.scrollTop = rolo.scrollHeight;
  document.getElementById("pensa-n").textContent = ++pensaTotal;
}

function corEmPalavras(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255,
        g = parseInt(hex.slice(3, 5), 16) / 255,
        b = parseInt(hex.slice(5, 7), 16) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  const s = mx === mn ? 0 : (mx - mn) / (1 - Math.abs(2 * l - 1));
  let h = 0;
  if (mx !== mn) {
    if (mx === r) h = ((g - b) / (mx - mn)) % 6;
    else if (mx === g) h = (b - r) / (mx - mn) + 2;
    else h = (r - g) / (mx - mn) + 4;
    h = (h * 60 + 360) % 360;
  }
  const luz = l < .18 ? "deep" : l < .38 ? "dark" : l < .62 ? "mid"
            : l < .82 ? "pale" : "bone";
  if (s < .09) return luz + " grey";
  const tom = h < 20 ? "red" : h < 45 ? "rust" : h < 70 ? "ochre"
            : h < 160 ? "olive" : h < 200 ? "teal" : h < 260 ? "blue"
            : h < 320 ? "violet" : "red";
  return (s < .28 ? "muted " : "") + luz + " " + tom;
}

let pincelAtivoSem = null;
function acenderPincel(sem) {
  if (sem === pincelAtivoSem) return;
  pincelAtivoSem = sem;
  let n = 0, idx = 0;
  for (const t of document.querySelectorAll("#pinceis-grade .pincel")) {
    n++;
    if (t.dataset.sem == sem) idx = n;
    t.classList.toggle("ativo", t.dataset.sem == sem);
  }
  // (21/08: o log e a CABECA do pintor, nao telemetria -- troca de pincel
  // acende no painel, mas nao vira linha de pensamento)
}

// o papo do servidor (devaneios do pintor + chat da live + respostas)
const esPapo = new EventSource("/papo");
esPapo.addEventListener("papo", e => {
  const m = JSON.parse(e.data);
  pensar(m.rotulo, m.texto, m.hora);
});

// trama do tecido por cima da tinta, bem sutil -- espelha a trama que o
// motor come na tinta rala (nao precisa bater pixel a pixel, e materia)
function desenharTrama(largura, altura) {
  const c = document.getElementById("trama");
  c.width = largura; c.height = altura;
  const x = c.getContext("2d");
  const d = x.createImageData(largura, altura);
  const f = 2 * Math.PI / 4.6;
  for (let y = 0; y < altura; y++) {
    for (let i = 0; i < largura; i++) {
      const v = 0.5 + 0.25 * Math.sin(i * f) + 0.25 * Math.sin(y * f);
      const k = (y * largura + i) * 4;
      const escuro = v < 0.5;
      d.data[k] = d.data[k + 1] = d.data[k + 2] = escuro ? 0 : 255;
      d.data[k + 3] = Math.abs(v - 0.5) * 26;   // alfa max ~5%
    }
  }
  x.putImageData(d, 0, 0);
}

// Cerdas: o mesmo LCG do pincel.py (48271 mod 65521) -- os numeros tem de
// bater um a um para o player desenhar o MESMO arranjo de fios do motor.
// (Caminho antigo: gravacoes sem carimbos usam este arranjo por tufos.)
const perfisCerdas = new Map();
function perfilCerdas(sem) {
  let p = perfisCerdas.get(sem);
  if (p) return p;
  let s = sem & 0xFFFF;
  const prox = () => (s = (s * 48271 + 11) % 65521) / 65521;
  p = [];
  for (let j = 0; j < 5; j++) {
    const pos = (prox() * 2 - 1) * 0.8;
    const larg = 0.05 + 0.11 * prox();
    const forca = 0.4 + 0.6 * prox();
    p.push([pos, larg, forca]);
  }
  perfisCerdas.set(sem, p);
  return p;
}

// Um toque e um disco de borda macia. O gradiente radial reproduz o mesmo
// perfil do motor Python: nucleo cheio ate `dureza`, queda suave ate a borda.
// Toques novos trazem [cerdas, sem, seco]: os fios entram como tufos finos
// dentro do disco (eixo da largura = y no quadro girado), e o seco apaga
// primeiro os fios fracos -- gravacoes antigas de 8 campos seguem valendo.
function toque(t) {
  const [x, y, r, cor, alfa, dur, achat, ang] = t;
  if (r < 0.4 || alfa <= 0.004) return;
  const cerdas = t.length > 8 ? t[8] : 0;
  const sem = t.length > 9 ? t[9] : 0;
  const seco = t.length > 10 ? (t[10] || 0) : 0;
  // tampa 0 = miolo de traco varrido: estica a estampa no eixo do traco
  // para os toques emendarem numa fita continua
  const tampa = t.length > 11 ? t[11] : 1;
  const estica = tampa < 0.5 ? 1.8 : 1;
  ctx.save();
  ctx.translate(x, y);
  if (ang) ctx.rotate(ang);
  if (achat !== 1) ctx.scale(achat, 1);
  const st = cerdas > 0.02 ? carimbos[sem] : null;
  if (st) {
    // bisel do impasto: a crista da tinta pega luz de um lado e sombreia
    // do outro (deslocado no eixo da LARGURA, perpendicular ao traco)
    const dv = Math.max(0.7, r * 0.06);
    const aBase = alfa * (1 - 0.5 * seco);
    // textura e diferente de relevo (Michel, 20/08): o bisel 3D vira
    // sussurro -- a textura fica por conta do proprio toque
    if (r > 2.5) {
      ctx.globalAlpha = aBase * 0.07;
      ctx.drawImage(st.sombra, -r, -r + dv, 2 * r, 2 * r);
      ctx.globalAlpha = aBase * 0.05;
      ctx.drawImage(st.brilho, -r, -r - dv, 2 * r, 2 * r);
    }
    // estampa o bico tingido na cor do toque (source-in preserva o alfa)
    st.tx.globalCompositeOperation = "source-over";
    st.tx.clearRect(0, 0, st.tc.width, st.tc.height);
    st.tx.drawImage(st.img, 0, 0);
    st.tx.globalCompositeOperation = "source-in";
    st.tx.fillStyle = cor;
    st.tx.fillRect(0, 0, st.tc.width, st.tc.height);
    ctx.globalAlpha = aBase;
    ctx.drawImage(st.tc, -r * estica, -r, 2 * r * estica, 2 * r);
    ctx.restore();
    return;
  }
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
  g.addColorStop(0, cor);
  g.addColorStop(Math.max(0, Math.min(0.97, dur)), cor);
  g.addColorStop(1, cor + "00");
  // com cerdas, o disco base abaixa e os tufos fazem o corpo do toque
  ctx.globalAlpha = alfa * (1 - 0.55 * cerdas) * (1 - 0.5 * seco);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, 6.2832);
  ctx.fill();
  if (cerdas > 0.02) {
    // crista de cor: o fio carregado fica um pouco mais claro que o corpo,
    // igual ao `sombra` do motor -- so alfa nao segura a estria na sobreposicao
    const rr = parseInt(cor.slice(1, 3), 16);
    const gg = parseInt(cor.slice(3, 5), 16);
    const bb = parseInt(cor.slice(5, 7), 16);
    for (const [pos, larg, forca] of perfilCerdas(sem)) {
      if (forca < seco) continue;      // fio seco levanta da tela primeiro
      const s = 1 + 0.38 * cerdas * (forca - 0.4);
      const cr = Math.min(255, rr * s) | 0, cg = Math.min(255, gg * s) | 0,
            cb = Math.min(255, bb * s) | 0;
      ctx.save();
      ctx.translate(0, pos * r * 0.9);
      ctx.scale(1, Math.max(0.05, larg) * 1.6);
      const g2 = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
      g2.addColorStop(0, `rgba(${cr},${cg},${cb},1)`);
      g2.addColorStop(0.7, `rgba(${cr},${cg},${cb},1)`);
      g2.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
      ctx.globalAlpha = alfa * cerdas * forca * 0.9 * (1 - 0.35 * seco);
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, 6.2832);
      ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();
}

let ultimo = 0, acumulado = 0;
const cvM = document.getElementById("maos");
const ctxM = cvM.getContext("2d");
const elTinta = document.getElementById("tinta");

// O ritmo humano: pincel largo varre rapido, pincel fino demora. Ritmo
// constante e o que entrega "programa" -- mas a faixa antiga (0,4-3,5,
// ~9x de salto entre fases) dava "acelerou do nada" na live (21/08).
// Faixa estreitada: no maximo ~2,7x entre a fase mais rapida e a mais lenta.
function custo(raio) { return Math.min(2.0, Math.max(0.75, 15 / raio)); }

function pincelNaTela(t) {
  // a "mao" do pintor: anel do tamanho do pincel sobre o ultimo toque
  ctxM.clearRect(0, 0, cvM.width, cvM.height);
  if (!t) return;
  const [x, y, r, cor] = t;
  ctxM.strokeStyle = "rgba(255,255,255,.75)";
  ctxM.lineWidth = 1.2;
  ctxM.beginPath(); ctxM.arc(x, y, Math.max(3, r), 0, 6.2832); ctxM.stroke();
  ctxM.strokeStyle = "rgba(0,0,0,.5)";
  ctxM.beginPath(); ctxM.arc(x, y, Math.max(3, r) + 1.4, 0, 6.2832); ctxM.stroke();
  ctxM.fillStyle = cor;
  ctxM.beginPath(); ctxM.arc(x, y, 2.2, 0, 6.2832); ctxM.fill();
  elTinta.style.background = cor;
  document.getElementById("puck-cor").style.background = cor;
}

function laco(agora) {
  // dt real entre quadros: o ritmo nao depende da taxa de quadros, e voltar
  // de uma aba em segundo plano nao despeja tudo de uma vez
  const dt = ultimo ? Math.min(0.25, (agora - ultimo) / 1000) : 0;
  ultimo = agora;

  if (tocando && lido < fila.length) {
    acumulado += dt * porSegundo();
    let mexeu = false;
    while (lido < fila.length && acumulado >= custo(fila[lido][2])) {
      acumulado -= custo(fila[lido][2]);
      toque(fila[lido++]); feitos++;
      mexeu = true;
    }
    if (mexeu) {
      aplicarTrocas();
      pincelNaTela(fila[lido - 1]);
      acenderPincel(fila[lido - 1][9] || 0);
      elNum.textContent = feitos.toLocaleString("pt-BR");
      if (total) {
        const pct = (100 * feitos / total).toFixed(1) + "%";
        elProg.style.width = pct;
        document.getElementById("app-prog").style.width = pct;
      }
    }
  } else {
    acumulado = Math.min(acumulado, 4);
  }

  const faltam = total - feitos;
  elResta.textContent = faltam > 0 ? formatarTempo(faltam / porSegundo()) : "";
  if (pronto && lido >= fila.length && faltam <= 0) {
    elFala.textContent = "obra concluída.";
    // canal continuo: respira 8s diante da obra pronta e vai pra proxima
    if (cicloAtivo && !window._virando) {
      window._virando = true;
      document.getElementById("faixa-fala").textContent =
        "obra concluída — a próxima já vem.";
      document.getElementById("legenda-app").textContent =
        "Artwork complete — the next canvas is coming.";
      pensar("done", "signing off this one. next canvas in a moment.");
      setTimeout(() => location.reload(), 8000);
    }
  }
  requestAnimationFrame(laco);
}
requestAnimationFrame(laco);

btn.onclick = () => {
  tocando = !tocando;
  btn.textContent = tocando ? "pausar" : "continuar";
};
function mostrarVel() { elVelNum.textContent = porSegundo().toLocaleString("pt-BR") + "/s"; }
elVel.oninput = mostrarVel;
mostrarVel();

// modo OBS: a cena vira um "app de pintura" (en-US, lingua da stream)
const parametros = new URLSearchParams(location.search);
const modoObs = parametros.has("obs");
if (modoObs) document.body.classList.add("obs");
// ?vel=0..100 fixa a velocidade (o OBS nao tem os controles na tela)
if (parametros.has("vel")) {
  const v0 = Math.max(0, Math.min(100, +parametros.get("vel") || 42));
  document.getElementById("vel").value = v0;
}
const elLetreiro = document.getElementById("letreiro");
let cicloAtivo = false;

const FASE_EN = { esboco: "Sketch", planos: "Blocking", chapadas: "Shapes",
  forma: "Form", cor: "Color", velaturas: "Glazes", tecido: "Paint weave",
  foco: "Refine", acabamento: "Finishing", minucia: "Fine detail",
  arestas: "Edge lines", retrato: "Portrait pass", luz: "Highlights" };
const LEGENDA_EN = {
  esboco: "Laying down the drawing — finding where the subject turns.",
  planos: "Big masses first: one value per region.",
  chapadas: "Each shape is a single decision.",
  forma: "A mid-size brush following the form.",
  cor: "Local color, smaller touch.",
  velaturas: "Calming the quiet zones — edges get lost.",
  tecido: "Touch beside touch: the whole canvas breathes.",
  foco: "The fine brush goes only where it is needed.",
  acabamento: "Last pass: just the tip of the brush.",
  minucia: "Waking up sparkle, lash and thread.",
  arestas: "The line comes back, only where the edge asks.",
  retrato: "The focus deserves twice the time.",
  luz: "Thick paint, only in the light." };

const linhasCamada = {};
function linhaCamada(nome) {
  if (linhasCamada[nome]) return linhasCamada[nome];
  const div = document.createElement("div");
  div.className = "item";
  div.innerHTML = "<span class='olho'>&#128065;</span>" +
                  (FASE_EN[nome] || nome);
  document.getElementById("camadas-app").appendChild(div);
  linhasCamada[nome] = div;
  return div;
}

const es = new EventSource("/eventos");

es.addEventListener("espera", e => {
  const d = JSON.parse(e.data);
  elFala.textContent = d.fala || "aguarde...";
  document.getElementById("faixa-fala").textContent = d.fala || "aguarde...";
  document.getElementById("legenda-app").textContent =
    "The painter is preparing the first canvas...";
});

es.addEventListener("inicio", e => {
  const d = JSON.parse(e.data);
  cv.width = d.largura; cv.height = d.altura;
  cvM.width = d.largura; cvM.height = d.altura;
  ctx.fillStyle = d.fundo;
  ctx.fillRect(0, 0, cv.width, cv.height);
  total = d.total;
  cicloAtivo = !!d.ciclo;
  carregarCarimbos(d.carimbos);
  desenharTrama(d.largura, d.altura);
  elFala.textContent = d.fala || "";
  document.getElementById("faixa-titulo").textContent = d.titulo || "estudo do atelier";
  document.getElementById("faixa-fala").textContent = d.fala || "";
  document.getElementById("app-doc").textContent =
    (d.titulo || "untitled") + " — oil study";
});

// A troca de camada NAO acontece ao receber o evento: o servidor despeja a
// gravacao muito mais rapido do que o player pinta, e a fala da ultima
// camada apareceria no comeco. Guarda o ponto da fila e troca quando o
// pincel CHEGA la.
const trocas = [];
es.addEventListener("camada", e => {
  const d = JSON.parse(e.data);
  trocas.push({ em: fila.length, d });
  linhaCamada(d.nome);      // a lista de Layers cresce na ordem da obra
});
function aplicarTrocas() {
  while (trocas.length && lido >= trocas[0].em) {
    const { d } = trocas.shift();
    elCam.textContent = d.nome;
    if (d.fala) {
      elFala.textContent = d.fala;
      document.getElementById("faixa-fala").textContent = d.fala;
    }
    document.getElementById("faixa-fase").textContent = d.nome || "";
    // painel do app: camada ativa acende, anteriores ficam "feitas"
    for (const [n, div] of Object.entries(linhasCamada)) {
      if (div.classList.contains("ativa")) {
        div.classList.remove("ativa");
        div.classList.add("feita");
      }
    }
    if (d.nome) linhaCamada(d.nome).classList.add("ativa");
    document.getElementById("legenda-app").textContent =
      LEGENDA_EN[d.nome] || "";
  }
}

es.addEventListener("toques", e => { fila.push(...JSON.parse(e.data)); });

es.addEventListener("fim", () => { pronto = true; es.close(); });

es.onerror = () => { if (!pronto) elFala.textContent = "conexão perdida."; };
</script>
