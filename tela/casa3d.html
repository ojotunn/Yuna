<meta charset="utf-8">
<title>A casa da Yuna em 3D</title>
<style>
  html,body{margin:0;background:#121017;color:#e8e4f0;
    font:13px system-ui,-apple-system,sans-serif;overflow:hidden}
  .topo{position:fixed;top:0;left:0;right:0;z-index:5;padding:9px 14px;
    background:rgba(18,16,23,.94);border-bottom:1px solid #2c2839;
    display:flex;gap:15px;align-items:center;flex-wrap:wrap}
  label{display:flex;gap:6px;align-items:center;color:#c9c2da;cursor:pointer}
  input[type=checkbox]{accent-color:#c96ad8;width:15px;height:15px}
  input[type=range]{width:105px;accent-color:#c96ad8}
  b{color:#e8e4f0}
  .num{font-family:ui-monospace,monospace;color:#c96ad8;font-size:12px}
  canvas{display:block;image-rendering:pixelated;cursor:grab}
  .ref{position:fixed;right:12px;bottom:12px;width:250px;opacity:.42;
    border:1px solid #2c2839;border-radius:5px;pointer-events:none}
  .aviso{position:fixed;left:14px;bottom:14px;color:#8b83a1;font-size:12px;
    max-width:46ch;line-height:1.5}
</style>

<div class="topo">
  <b>A casa da Yuna em 3D</b>
  <label><input type="checkbox" id="toon" checked> Luz em degraus</label>
  <label><input type="checkbox" id="pix" checked> Resolucao baixa</label>
  <label><input type="checkbox" id="girar"> Girar sozinho</label>
  <label>zoom <input type="range" id="zm" min="30" max="220" value="95"></label>
  <span class="num" id="num">carregando…</span>
</div>

<img class="ref" src="/casa/CASA-VAZIA.png" alt="">
<p class="aviso">Arraste para girar. A roda do mouse aproxima.
O desenho 2D esta no canto para comparar.</p>
<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const c = document.getElementById("c");
const ren = new THREE.WebGLRenderer({canvas:c, antialias:false});
ren.setClearColor(0x121017);
ren.outputEncoding = THREE.sRGBEncoding;   // senao a textura sai com a cor torta
const cena = new THREE.Scene();

/* CAMERA ORTOGRAFICA, o mesmo angulo do desenho 2D dela. */
let zoom = 0.95;
const cam = new THREE.OrthographicCamera(-1,1,1,-1,-300,600);
function encaixar(){
  const a = innerWidth/innerHeight;
  cam.left=-zoom*a; cam.right=zoom*a; cam.top=zoom; cam.bottom=-zoom;
  cam.updateProjectionMatrix();
}
cam.position.set(40,34,40); cam.lookAt(0,0,0);

/* LUZ NEUTRA: a cor mora na textura, a luz so multiplica. Luz colorida
   forte tinge tudo e a arte dele se perde. */
cena.add(new THREE.AmbientLight(0xc4bcd4, 1.35));
const sol = new THREE.DirectionalLight(0xffffff, 1.15); sol.position.set(5,10,4); cena.add(sol);
const frio = new THREE.DirectionalLight(0x8fd8ff, 0.3); frio.position.set(-6,3,-4); cena.add(frio);

/* Rampa de 3 degraus para a luz chapada.
   RedFormat, NAO LuminanceFormat — o segundo foi removido no WebGL2 e deixa a
   rampa preta, o que faz todo pixel cair no degrau mais escuro. */
const RAMPA = (()=>{ const d=new Uint8Array([90,180,255]);
  const t=new THREE.DataTexture(d,3,1,THREE.RedFormat);
  t.minFilter=t.magFilter=THREE.NearestFilter; t.needsUpdate=true; return t; })();

const mundo = new THREE.Group(); cena.add(mundo);
let casa = null;

new THREE.GLTFLoader().load("/3d/CASA-VAZIA.glb", (g)=>{
  casa = g.scene;
  const cx = new THREE.Box3().setFromObject(casa);
  const t = cx.getSize(new THREE.Vector3());
  const meio = cx.getCenter(new THREE.Vector3());
  const s = 2.6/Math.max(t.x,t.y,t.z);
  casa.scale.setScalar(s);
  casa.position.copy(meio).multiplyScalar(-s);
  mundo.add(casa);

  let tri=0;
  casa.traverse(o=>{ if(o.isMesh){
    o.userData.orig = o.material;
    if (o.material.map) o.material.map.encoding = THREE.sRGBEncoding;
    const g2 = o.geometry;
    tri += (g2.index ? g2.index.count : g2.attributes.position.count)/3;
  }});
  document.getElementById("num").textContent =
    `${tri.toLocaleString("pt-BR")} triangulos · 3,2 MB`;
  aplicar();
});

function aplicar(){
  if (!casa) return;
  const toon = document.getElementById("toon").checked;
  casa.traverse(o=>{
    if (!o.isMesh) return;
    o.material = toon
      ? new THREE.MeshToonMaterial({ map:o.userData.orig.map||null, gradientMap:RAMPA })
      : o.userData.orig;
  });
}
document.getElementById("toon").onchange = aplicar;
document.getElementById("zm").oninput = e => { zoom = +e.target.value/100; encaixar(); };

let arr=false, ux=0;
c.onmousedown = e=>{ arr=true; ux=e.clientX; c.style.cursor="grabbing"; };
onmouseup = ()=>{ arr=false; c.style.cursor="grab"; };
onmousemove = e=>{ if(arr){ mundo.rotation.y += (e.clientX-ux)*0.008; ux=e.clientX; } };
onwheel = e=>{ zoom = Math.max(0.3, Math.min(2.2, zoom + e.deltaY*0.0009));
               document.getElementById("zm").value = Math.round(zoom*100); encaixar(); };

function laco(){
  requestAnimationFrame(laco);
  if (document.getElementById("girar").checked) mundo.rotation.y += 0.0035;
  const esc = document.getElementById("pix").checked ? 0.33 : 1;
  const w = Math.round(innerWidth*esc), h = Math.round(innerHeight*esc);
  if (c.width !== w){ ren.setSize(w,h,false); c.style.width="100vw"; c.style.height="100vh"; }
  encaixar();
  ren.render(cena, cam);
}
laco();
</script>
