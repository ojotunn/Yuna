<meta charset="utf-8">
<title>A casa da Yuna, construida</title>
<style>
  html,body{margin:0;background:#121017;color:#e8e4f0;
    font:13px system-ui,-apple-system,sans-serif;overflow:hidden}
  .topo{position:fixed;top:0;left:0;right:0;z-index:5;padding:9px 14px;
    background:rgba(18,16,23,.94);border-bottom:1px solid #2c2839;
    display:flex;gap:15px;align-items:center;flex-wrap:wrap}
  label{display:flex;gap:6px;align-items:center;color:#c9c2da;cursor:pointer}
  input[type=checkbox]{accent-color:#c96ad8;width:15px;height:15px}
  input[type=range]{width:100px;accent-color:#c96ad8}
  b{color:#e8e4f0}
  .num{font-family:ui-monospace,monospace;color:#c96ad8;font-size:12px}
  canvas{display:block;image-rendering:pixelated;cursor:grab}
  .ref{position:fixed;right:12px;bottom:12px;width:260px;opacity:.45;
    border:1px solid #2c2839;border-radius:5px;pointer-events:none}
  .aviso{position:fixed;left:14px;bottom:14px;color:#8b83a1;font-size:12px;
    max-width:44ch;line-height:1.5}
</style>

<div class="topo">
  <b>A casa da Yuna</b>
  <label><input type="checkbox" id="piso" checked> Piso</label>
  <label><input type="checkbox" id="paredes" checked> Paredes</label>
  <label><input type="checkbox" id="pix" checked> Resolucao baixa</label>
  <label>altura <input type="range" id="alt" min="50" max="500" value="300"></label>
  <label>zoom <input type="range" id="zm" min="40" max="260" value="115"></label>
  <span class="num" id="num">…</span>
</div>

<img class="ref" src="/casa/CASA-PLANTA.png" alt="">
<p class="aviso">Arraste para girar. A planta 2D esta no canto para comparar.</p>
<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
const c = document.getElementById("c");
const ren = new THREE.WebGLRenderer({canvas:c, antialias:false});
ren.setClearColor(0x121017);
const cena = new THREE.Scene();

/* CAMERA ORTOGRAFICA no angulo isometrico classico — o mesmo do desenho 2D
   dela, por isso a casa deve parecer a mesma planta. */
let zoom = 1.15;
const cam = new THREE.OrthographicCamera(-1,1,1,-1,-400,800);
function encaixar(){
  const a = innerWidth/innerHeight;
  cam.left=-zoom*a*6; cam.right=zoom*a*6; cam.top=zoom*6; cam.bottom=-zoom*6;
  cam.updateProjectionMatrix();
}
cam.position.set(60,52,60); cam.lookAt(0,0,0);

/* LUZ NEUTRA: a cor mora no material, a luz so multiplica. */
cena.add(new THREE.AmbientLight(0xc9c1d8, 1.3));
const sol = new THREE.DirectionalLight(0xffffff, 1.05); sol.position.set(6,11,4); cena.add(sol);
const frio = new THREE.DirectionalLight(0x8fd8ff, 0.32); frio.position.set(-7,4,-5); cena.add(frio);

/* Rampa de 3 degraus. RedFormat — LuminanceFormat foi removido no WebGL2 e
   deixa a rampa preta, o que joga todo pixel no degrau mais escuro. */
const RAMPA = (()=>{ const d=new Uint8Array([95,180,255]);
  const t=new THREE.DataTexture(d,3,1,THREE.RedFormat);
  t.minFilter=t.magFilter=THREE.NearestFilter; t.needsUpdate=true; return t; })();
const toon = (cor)=> new THREE.MeshToonMaterial({color:cor, gradientMap:RAMPA});

/* Cores medidas do cenario 2D dela. */
const MAT = {
  piso:   toon(0x7a4d6e),
  parede: toon(0x5a4a72),
  rodape: toon(0x2e2340),
  ladrilho: toon(0x9aa4b4),   // o piso da cozinha, medido da planta
};

const mundo = new THREE.Group(); cena.add(mundo);
const gPiso = new THREE.Group(), gParede = new THREE.Group();
mundo.add(gPiso, gParede);

let dados = null, ALTURA = 3.0;
const T = 1;                 // uma celula da grade = 1 unidade de mundo
const ESP = 0.14;            // espessura da parede

fetch("/casa/casa-construida.json").then(r=>r.json()).then(d=>{ dados=d; montar(); });

function montar(){
  gPiso.clear(); gParede.clear();
  const cx = dados.gx/2, cz = dados.gy/2;   // centra a casa na origem

  /* PISO: cada retangulo da varredura vira UMA laje. */
  const ehLadrilho = new Set((dados.ladrilho||[]).map(([x,y])=>x+","+y));
  for (const [x0,y0,x1,y1] of dados.piso){
    /* Se o retangulo cai sobre a cozinha, sai celula a celula pra pegar a cor
       certa; senao vai como uma laje so, que e mais barato. */
    let temLadrilho = false;
    for (let y=y0;y<=y1 && !temLadrilho;y++)
      for (let x=x0;x<=x1;x++) if (ehLadrilho.has(x+","+y)) { temLadrilho = true; break; }
    if (!temLadrilho){
      const g = new THREE.BoxGeometry((x1-x0+1)*T, 0.12, (y1-y0+1)*T);
      const m = new THREE.Mesh(g, MAT.piso);
      m.position.set((x0+x1+1)/2 - cx, -0.06, (y0+y1+1)/2 - cz);
      gPiso.add(m); continue;
    }
    for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
      const g = new THREE.BoxGeometry(T, 0.12, T);
      const m = new THREE.Mesh(g, ehLadrilho.has(x+","+y) ? MAT.ladrilho : MAT.piso);
      m.position.set(x+0.5-cx, -0.06, y+0.5-cz);
      gPiso.add(m);
    }
  }

  /* PAREDES so no fundo (norte e oeste). A casa e CORTADA: parede na frente
     taparia a camera — foi um dos defeitos da versao convertida. */
  for (const [x,y,n] of dados.paredeN){
    const g = new THREE.BoxGeometry(n*T, ALTURA, ESP);
    const m = new THREE.Mesh(g, MAT.parede);
    m.position.set(x + n/2 - cx, ALTURA/2, y - cz);
    gParede.add(m);
  }
  for (const [x,y,n] of dados.paredeO){
    const g = new THREE.BoxGeometry(ESP, ALTURA, n*T);
    const m = new THREE.Mesh(g, MAT.parede);
    m.position.set(x - cx, ALTURA/2, y + n/2 - cz);
    gParede.add(m);
  }

  document.getElementById("num").textContent =
    `${dados.piso.length} lajes · ${dados.paredeN.length+dados.paredeO.length} paredes · `
    + `${(gPiso.children.length+gParede.children.length)*12} triangulos`;
}

document.getElementById("piso").onchange    = e => gPiso.visible = e.target.checked;
document.getElementById("paredes").onchange = e => gParede.visible = e.target.checked;
document.getElementById("alt").oninput = e => { ALTURA = +e.target.value/100; if(dados) montar(); };
document.getElementById("zm").oninput  = e => { zoom = +e.target.value/100; encaixar(); };

let arr=false, ux=0;
c.onmousedown = e=>{ arr=true; ux=e.clientX; c.style.cursor="grabbing"; };
onmouseup = ()=>{ arr=false; c.style.cursor="grab"; };
onmousemove = e=>{ if(arr){ mundo.rotation.y += (e.clientX-ux)*0.008; ux=e.clientX; } };
onwheel = e=>{ zoom = Math.max(0.4, Math.min(2.6, zoom + e.deltaY*0.0009));
               document.getElementById("zm").value = Math.round(zoom*100); encaixar(); };

function laco(){
  requestAnimationFrame(laco);
  const esc = document.getElementById("pix").checked ? 0.34 : 1;
  const w = Math.round(innerWidth*esc), h = Math.round(innerHeight*esc);
  if (c.width !== w){ ren.setSize(w,h,false); c.style.width="100vw"; c.style.height="100vh"; }
  encaixar();
  ren.render(cena, cam);
}
laco();
</script>
